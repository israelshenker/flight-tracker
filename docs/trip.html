<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- Always check with the server: page updates should show up on the next visit, not after a browser cache expires. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="referrer" content="no-referrer">
<title>Trip fares</title>
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1e;--muted:#6b6b70;--line:#e4e2dc;--up:#b42318;--down:#067647;--accent:#2754c5;--soft:#eef2fc}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f2f2f3;--muted:#9a9aa1;--line:#2c2c31;--up:#f97066;--down:#47cd89;--accent:#8ea8ff;--soft:#23283a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 16px 60px}
main{max-width:780px;margin:0 auto}
/* Wider screens (laptops, desktops) get more room, mostly for the calendar; phones keep the narrow layout. */
@media (min-width:1100px){main{max-width:min(1500px,calc(100vw - 64px))}}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:22px 0 8px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid thead th:first-child,table.grid tbody th{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
table.grid tbody th{font-weight:600}
button.sortby{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
button.sortby.on{color:var(--accent);font-weight:650}
table.grid td button{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
table.grid td button.up{color:var(--up)}
table.grid td button.down{color:var(--down)}
table.grid td.best{background:color-mix(in srgb,var(--down) 13%,transparent)}
table.grid td.best button{text-decoration:underline;text-decoration-color:var(--down);text-underline-offset:3px}
table.grid td.on{outline:2px solid var(--accent);outline-offset:-2px}
table.grid td button.na{color:var(--muted);font-weight:500}
table.grid td button.gone{color:var(--up);font-weight:650}
.gsk{display:block;font-size:11px;font-weight:600;color:#a21caf}
@media (prefers-color-scheme:dark){.gsk{color:#f0abfc}}
.movedot{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:#7c3aed;margin-right:.3em;vertical-align:.15em}
.detail{border-color:var(--accent);margin-top:14px}
.detail .price{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.price.up{color:var(--up)} .price.down{color:var(--down)}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:6px;display:inline-block}
.badge.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.badge.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.spark{color:var(--accent);vertical-align:middle}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.close{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:0}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:14px}
.empty{text-align:center;padding:40px 10px}
td.times{color:var(--muted);font-size:13px}
.rt{border-color:var(--accent);margin-top:14px}
.rthead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.rttotal{margin-left:auto;font-size:18px}
.rtleg{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rtlabel{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--accent)}
.rtprice{margin-left:auto}
.rt select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.skipnote{margin-top:10px;font-size:14px;line-height:1.6}
.bagnote{margin-top:10px;font-size:13px;color:var(--up)}
.bagflag{color:var(--up);font-weight:700}
.signup{margin-top:14px}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.opts label{display:flex;gap:6px;align-items:center}
.signup .opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:10px 0}
.signup label{display:flex;gap:6px;align-items:center;font-size:14px}
.signup input[type=email],.signup select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.signup input[type=email]{width:260px}
.btn{font:inherit;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 14px;cursor:pointer;font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#10131c}}
.link{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer}
.msg{font-size:14px;margin-top:8px}
.msg.bad{color:var(--up)} .msg.good{color:var(--down)}
.stop1{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:color-mix(in srgb,#0284c7 15%,transparent);color:#0369a1}
@media (prefers-color-scheme:dark){.stop1{color:#7dd3fc}}
.gone1{display:block;font-size:11px;font-weight:600;color:#0369a1}
@media (prefers-color-scheme:dark){.gone1{color:#7dd3fc}}
.skip{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:color-mix(in srgb,#c026d3 14%,transparent);color:#a21caf}
@media (prefers-color-scheme:dark){.skip{color:#f0abfc}}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
// A read-only page for one shared trip. The link looks like trip.html#<token> (or, for trips
// shared before tokens, #<id>.<key>): the part after # never leaves the browser. The tracker
// saves t/<id>.json every hour, locked with the trip's key (AES-GCM), holding only its fares.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const unb64url = t => unb64(t.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - t.length % 4) % 4));
function niceDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
}
const when = s => new Date(s).toLocaleString("en-US", {timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
function ago(s) {
  const m = Math.round((Date.now() - new Date(s)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} hr ago` : `${Math.round(h / 24)} days ago`;
}
const timeLabel = hhmm => { const [h, m] = hhmm.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
function sparkline(prices) {
  const v = prices.filter(p => p != null);
  if (v.length < 2) return "";
  const w = 140, h = 30, lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1, step = w / (v.length - 1);
  const pts = v.map((p, i) => `${(i * step).toFixed(1)},${(h - 3 - (p - lo) / span * (h - 6)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
// Same 24-hour rule as the main page: compare with the fare 24 hours before the latest check.
function day(leg) {
  const t = leg.moves;
  if (!t?.length || leg.price == null) return null;
  const cutoff = new Date(Date.parse(leg.checked_at) - 864e5).toISOString().slice(0, 19);
  const base = t[0][1], moves = t.length - 1;
  return {base, moves, full: t[0][0].slice(0, 19) <= cutoff,
          hours: Math.max(1, Math.round((Date.parse(leg.checked_at) - Date.parse(t[0][0])) / 36e5))};
}
const moveClass = leg => { const m = day(leg); return !m || m.base == null || m.base === leg.price ? "" : leg.price > m.base ? "up" : "down"; };
const moveDot = leg => { const m = day(leg); return m && m.moves > (m.base !== leg.price ? 1 : 0) ? `<span class="movedot"></span>` : ""; };

let rtBest = false, rtOut = "", rtBack = "";  // cheapest round trip card: its own switch and dates
let sortBest = false;  // false = order by the nonstop fare, true = by the cheapest of the three
const sortBy = {};  // per table ("Going", "Coming back", "Flights"): a date, "route", or nothing
let trip = null, open = null, shareId = null, shareKey = null, stopId = null, signupOpen = false;
// Read the trip file straight from the newest saved version on GitHub, so a check's new fares
// show up seconds after it saves (the published site takes a minute or two to rebuild). If
// GitHub's API is unavailable (it allows 60 requests an hour per visitor), use the published copy.
const REPO_RAW = "https://raw.githubusercontent.com/israelshenker/flight-tracker";
const REPO_API = "https://api.github.com/repos/israelshenker/flight-tracker/commits/main";
async function fetchTrip(id) {
  const file = `docs/t/${encodeURIComponent(id)}.json`;
  try {
    const sha = (await (await fetch(REPO_API, {cache: "no-store", headers: {Accept: "application/vnd.github.sha"}})).text()).trim();
    if (/^[0-9a-f]{40}$/.test(sha)) {
      const res = await fetch(`${REPO_RAW}/${sha}/${file}`, {cache: "no-store"});
      if (res.status === 404) return null;
      if (res.ok) return await res.json();
    }
  } catch {}
  const res = await fetch(`t/${encodeURIComponent(id)}.json?${Date.now()}`, {cache: "no-store"});
  if (res.status === 404) return null;
  return await res.json();
}
async function load() {
  // Short links: #<token>[.stop.<subscriber>]; the file id and key come from the token (same
  // derivation as index.html's newShare). Older links: #<file id>.<key>[.stop.<subscriber>].
  const parts = location.hash.slice(1).split(".");
  let id, key, verb, subId;
  if (parts[1] && parts[1] !== "stop") [id, key, verb, subId] = parts;
  else {
    const sha = async x => new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(x)));
    const b64u = b => { let t = ""; for (const x of b) t += String.fromCharCode(x); return btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
    if (parts[0]) {
      id = [...(await sha("id:" + parts[0])).slice(0, 12)].map(b => b.toString(16).padStart(2, "0")).join("");
      key = b64u(await sha("key:" + parts[0]));
    }
    [verb, subId] = parts.slice(1);
  }
  shareId = id; shareKey = key; stopId = verb === "stop" ? subId : null;
  if (!id || !key) return fail("This link is incomplete. Ask for the link again.");
  let box;
  try {
    box = await fetchTrip(id);
    if (!box) return fail("This trip isn't shared anymore, or the link was replaced with a new one.");
  } catch { return fail("Couldn't load the trip. Check your connection and reload."); }
  try {
    const k = await crypto.subtle.importKey("raw", unb64url(key), "AES-GCM", false, ["decrypt"]);
    const data = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(box.iv)}, k, unb64(box.data));
    trip = JSON.parse(new TextDecoder().decode(data));
  } catch { return fail("This link doesn't open this trip. Ask for the link again."); }
  document.title = trip.name || "Trip fares";
  render();
}
function fail(text) { $("app").innerHTML = `<div class="card empty"><p>${esc(text)}</p></div>`; }

function table(legs, dir) {
  if (!legs.length) return "";
  const col = l => l.dep + (l.ret ? "|" + l.ret : "");
  const dates = [...new Set(legs.map(col))].sort();
  const rows = new Map();
  for (const l of legs) {
    const r = `${l.o} → ${l.d}${l.opts ? ` (${l.opts})` : ""}`;
    if (!rows.has(r)) rows.set(r, {});
    rows.get(r)[col(l)] = l;
  }
  const priced = l => l && l.price != null;
  // "Best price" counts the 1-stop and skiplagged fares too; "Nonstop" only the nonstop.
  const value = l => !priced(l) ? Infinity
    : sortBest ? Math.min(l.price, l.skip?.price ?? Infinity, l.onestop?.price ?? Infinity) : l.price;
  // Default: cheapest route first. Tap a date: routes with a fare that day (cheapest first), then
  // N/A / GONE that day, then routes not tracked that day. Tap Route: A to Z. Same as the main page.
  const cheapest = r => Math.min(...Object.values(r).map(value), 1e9);
  const by = sortBy[dir], tier = l => !l ? 2 : l.price == null ? 1 : 0;
  const list = [...rows].sort((a, b) => {
    if (by === "route") return a[0].localeCompare(b[0]);
    if (by && dates.includes(by)) {
      const x = a[1][by], y = b[1][by];
      const d = tier(x) - tier(y) || (tier(x) === 0 ? value(x) - value(y) : 0);
      if (d) return d;
    }
    return cheapest(a[1]) - cheapest(b[1]);
  });
  const head = (key, label, title) => `<button class="sortby${by === key ? " on" : ""}" data-sort="${esc(dir)}|${esc(key)}" title="${by === key ? "Back to cheapest route first" : title}">${label}${by === key ? " ↑" : ""}</button>`;
  return `<h2>${dir}</h2><div class="card tablewrap"><table class="grid"><thead><tr><th>${head("route", "Route", "Sort routes A to Z")}</th>${dates.map(d => {
    const [dep, ret] = d.split("|");
    return `<th class="num">${head(d, `${esc(niceDate(dep))}${ret ? `<br>back ${esc(niceDate(ret))}` : ""}`, "Sort by the fare on this date")}</th>`;
  }).join("")}</tr></thead><tbody>${list.map(([route, r]) => {
    const prices = Object.values(r).filter(priced).map(l => l.price), min = Math.min(...prices);
    return `<tr><th scope="row">${esc(route)}</th>${dates.map(d => {
      const l = r[d];
      if (!l) return `<td class="num muted">—</td>`;
      const i = trip.legs.indexOf(l), on = open === i ? " on" : "";
      if (!l.checked_at) return `<td class="num muted${on}">soon</td>`;
      if (l.price == null) return `<td class="num${on}"><button data-open="${i}" class="${l.last_price != null ? "gone" : "na"}">${l.last_price != null ? "GONE" : "N/A"}</button></td>`;
      return `<td class="num${prices.length > 1 && l.price === min ? " best" : ""}${on}"><button data-open="${i}" class="${moveClass(l)}" title="${esc(bagNote(l))}">${moveDot(l)}$${l.price}${bagNote(l) ? '<span class="bagflag" aria-label="bag fee not included">*</span>' : ""}</button>${l.skip ? `<span class="gsk">skip $${l.skip.price}</span>` : ""}${l.onestop ? `<span class="gone1">1 stop $${l.onestop.price}</span>` : ""}</td>`;
    }).join("")}</tr>`;
  }).join("")}</tbody></table></div>`;
}

function detail(i) {
  const l = trip.legs[i];
  if (!l) return "";
  const hist = l.history || [];
  const seen = hist.map(p => p[1]).filter(p => p != null);
  if (l.price != null) seen.push(l.price);
  const first = hist.find(p => p[1] != null)?.[1];
  const m = day(l);
  const badges = [];
  if (m && m.base != null && m.base !== l.price)
    badges.push(`<span class="badge ${l.price > m.base ? "up" : "down"}">${m.full ? "24 h" : `${m.hours} h`}: ${l.price > m.base ? "▲" : "▼"} $${Math.abs(l.price - m.base)}</span>`);
  if (first != null && l.price != null && l.price !== first && m?.full !== false)
    badges.push(`<span class="badge ${l.price > first ? "up" : "down"}">Since tracking began${hist[0] ? " " + esc(new Date(hist[0][0]).toLocaleDateString("en-US", {timeZone: "America/New_York", month: "short", day: "numeric"})) : ""}: ${l.price > first ? "▲" : "▼"} $${Math.abs(l.price - first)}</span>`);
  // Same detail as the owner's route card: every airline's lowest fare with its departure
  // times, and every nonstop flight that day.
  const others = Object.entries(l.airlines || {}).sort((a, b) => a[1] - b[1]);
  const airlineRows = others.map(([a, p]) => `<tr><td>${esc(a)}</td><td class="num">$${p}</td><td class="times">${esc((l.airline_times?.[a] || []).map(timeLabel).join(", "))}</td></tr>`).join("");
  const flightRows = (l.flights || []).map(f => `<tr><td>${esc(timeLabel(f.departs))}</td><td>${esc(f.flight ? `${f.flight.slice(0, 2)} ${f.flight.slice(2)}` : f.airline)}</td><td class="num">$${f.price}</td></tr>`).join("");
  const status = l.price == null
    ? `<div class="price">${l.last_price != null ? "No longer available" : "No nonstop flights"}</div><div class="muted small">${l.last_price != null ? `Last seen at $${l.last_price}. ` : ""}Nothing nonstop on the latest check.</div>`
    : `<div class="price ${moveClass(l)}">${moveDot(l)}$${l.price}</div><div class="muted small">${esc(l.airline)}${l.times?.length ? ` · leaves ${esc(l.times.map(timeLabel).join(", "))}` : ""}</div>`;
  const s = l.skip;
  return `<div class="card detail">
    <div class="row"><div><b>${esc(l.o)} → ${esc(l.d)}</b> · ${esc(niceDate(l.dep))}${l.ret ? `, back ${esc(niceDate(l.ret))}` : ""}${l.opts ? `<div class="muted small">${esc(l.opts)}</div>` : ""}</div><button class="close" data-close="1">Close</button></div>
    <div style="margin-top:8px">${status}</div>
    ${badges.length ? `<div style="margin-top:8px">${badges.join("")}</div>` : ""}
    ${seen.length ? `<div style="margin-top:8px" class="small">${sparkline([...hist.map(p => p[1]), l.price])} <span class="muted">Low $${Math.min(...seen)} · High $${Math.max(...seen)} since tracking began</span></div>` : ""}
    ${airlineRows ? `<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Airline</th><th class="num">Lowest fare</th><th>Departs at that fare</th></tr></thead><tbody>${airlineRows}</tbody></table></div>` : ""}
    ${flightRows ? `<details><summary>All ${l.flights.length} nonstop flight${l.flights.length > 1 ? "s" : ""}</summary><div class="tablewrap"><table><thead><tr><th>Departs</th><th>Flight</th><th class="num">Fare</th></tr></thead><tbody>${flightRows}</tbody></table></div></details>` : ""}
    ${bagNote(l) ? `<div class="bagnote">⚠ ${esc(bagNote(l))}</div>` : ""}
    ${l.onestop ? `<div class="skipnote"><span class="stop1">1 stop</span> <b>$${l.onestop.price}</b>${l.price != null ? ` <span class="muted">($${l.price - l.onestop.price} less)</span>` : ""} · ${esc(l.onestop.airline)} ${esc(timeLabel(l.onestop.departs))} · changes planes in ${esc(l.onestop.via)}, ${Math.floor(l.onestop.layover / 60)}h ${String(l.onestop.layover % 60).padStart(2, "0")}m between flights${l.onestop.arrives ? ` · arrives ${esc(timeLabel(l.onestop.arrives))}` : ""}${l.link1 ? ` · <a href="${esc(l.link1)}" target="_blank" rel="noopener noreferrer">1-stop flights on Google Flights ↗</a>` : ""}</div>` : ""}
    ${s ? `<div class="skipnote"><span class="skip">Skiplagged</span> <b>$${s.price}</b> · ${esc(s.airline)}${s.departs ? ` ${esc(timeLabel(s.departs))}` : ""} · a ticket to ${esc(s.final)} that stops in ${esc(l.d)}; you'd get off there. Carry-on only, and don't book the return on the same ticket.${s.international ? " International ticket: passport needed." : ""}</div>` : ""}
    <div class="small" style="margin-top:10px"><a href="${esc(l.link)}" target="_blank" rel="noopener noreferrer">Nonstop flights on Google Flights ↗</a>${l.checked_at ? ` <span class="muted">· checked ${esc(ago(l.checked_at))}</span>` : ""}</div>
    ${hist.length ? `<details><summary>Price history</summary><table><tbody>${hist.slice().reverse().map(p => `<tr><td>${esc(when(p[0]))}</td><td class="num">${p[1] == null ? "no nonstops" : "$" + p[1]}</td></tr>`).join("")}</tbody></table></details>` : ""}
  </div>`;
}

// "Email me updates": the request is locked with this trip's key and passed along through a
// message relay (ntfy.sh) that the hourly check reads; it emails from there. Nothing to install.
function signupHtml() {
  if (!trip.signup) return "";
  if (stopId) return `<div class="card signup"><b>Stop the email updates for this trip?</b>
    <div style="margin-top:10px"><button class="btn" data-stop-emails="1">Stop emails</button></div><div class="msg" id="signupMsg"></div></div>`;
  if (!signupOpen) return `<div style="margin-top:14px"><button class="btn" data-signup-open="1">Email me updates</button></div>`;
  const hours = Array.from({length: 24}, (_, h) => `<option value="${h}"${h === 8 ? " selected" : ""}>${h === 0 ? "midnight" : h === 12 ? "noon" : `${h % 12} ${h < 12 ? "AM" : "PM"}`}</option>`).join("");
  const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"].map((d, i) => `<option value="${i}">${d}</option>`).join("");
  return `<div class="card signup"><b>Email me fare updates for this trip</b>
    <div class="opts"><input type="email" id="suEmail" placeholder="you@example.com" autocomplete="email" aria-label="Email address"></div>
    <div class="opts">
      <label><input type="radio" name="suWhen" value="changes" checked> When prices change</label>
      <label><input type="radio" name="suWhen" value="daily"> Once a day</label>
      <label><input type="radio" name="suWhen" value="weekly"> Once a week</label>
    </div>
    <div class="opts" id="suTime" hidden><label id="suDayWrap" hidden>on <select id="suDay">${days}</select></label><label>at <select id="suHour">${hours}</select></label><span class="small muted">your time</span></div>
    <div><button class="btn" data-signup="1">Sign me up</button> <button class="link small" data-signup-close="1">Cancel</button></div>
    <div class="small muted" style="margin-top:8px">The first email, with today's fares, arrives within about an hour. Every email has a link to stop them.</div>
    <div class="msg" id="signupMsg"></div></div>`;
}
async function post(req) {
  const k = await crypto.subtle.importKey("raw", unb64url(shareKey), "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name: "AES-GCM", iv}, k, new TextEncoder().encode(JSON.stringify(req)));
  const b64 = b => { let t = ""; for (const x of new Uint8Array(b)) t += String.fromCharCode(x); return btoa(t); };
  const res = await fetch(`https://ntfy.sh/${encodeURIComponent(trip.signup)}`, {method: "POST", body: JSON.stringify({t: shareId, iv: b64(iv), data: b64(data)})});
  if (!res.ok) throw new Error(res.status);
}
function say(text, good) { const m = $("signupMsg"); if (m) { m.className = "msg " + (good ? "good" : "bad"); m.textContent = text; } }

// People reading a shared trip often don't know airport codes, so list the ones used here.
function airportKey() {
  const codes = [...new Set(trip.legs.flatMap(l => [l.o, l.d]))].sort();
  const named = codes.filter(c => trip.names?.[c]);
  if (!named.length) return "";
  return `<p class="small muted" style="margin:8px 0 0">Airports: ${named.map(c => `<b>${esc(c)}</b> ${esc(trip.names[c])}`).join(" · ")}</p>`;
}
// Google can't add some airlines' bag fees (e.g. Allegiant's carry-on), and flags those fares.
function bagNote(l) {
  const bad = Object.entries(l.bagless || {});
  if (!bad.length) return "";
  return bad.map(([a, what]) => `${a}: the ${what} fee isn't included in this price — check ${a}'s own site`).join("; ");
}
// The cheapest way to fly the trip: cheapest Going leg + cheapest Coming back leg, with a
// Nonstop / Best price switch and optional fixed dates (same as the owner's page).
function roundTripHtml() {
  const one = trip.legs.filter(l => !l.ret);
  const side = g => one.filter(l => l.going === g);
  const outDates = [...new Set(side(true).map(l => l.dep))].sort(), backDates = [...new Set(side(false).map(l => l.dep))].sort();
  if (!outDates.length) return "";
  if (!outDates.includes(rtOut)) rtOut = "";
  if (!backDates.includes(rtBack)) rtBack = "";
  const best = (g, day) => side(g).filter(l => l.price != null && (!day || l.dep === day)).map(l => {
    const price = rtBest ? Math.min(l.price, l.onestop?.price ?? Infinity, l.skip?.price ?? Infinity) : l.price;
    const kind = price === l.price ? "nonstop" : price === l.onestop?.price ? "1 stop" : "skiplagged";
    return {l, price, kind, airline: kind === "1 stop" ? l.onestop.airline : kind === "skiplagged" ? l.skip.airline : l.airline,
            bag: kind === "nonstop" ? bagNote(l) : ""};
  }).sort((a, b) => a.price - b.price)[0];
  const out = best(true, rtOut), back = backDates.length ? best(false, rtBack) : null;
  const pick = (id, dates, val) => `<select id="${id}"><option value="">Cheapest date</option>${dates.map(d => `<option value="${d}"${d === val ? " selected" : ""}>${esc(niceDate(d))}</option>`).join("")}</select>`;
  const row = (x, label, sel) => `<div class="rtleg"><span class="rtlabel">${label}</span>${sel}${x
    ? `<button class="link" data-open="${trip.legs.indexOf(x.l)}"><b>${esc(x.l.o)} → ${esc(x.l.d)}</b></button><span class="muted small">${esc(niceDate(x.l.dep))}${x.kind === "nonstop" ? "" : ` · ${x.kind}`}${x.airline ? ` · ${esc(x.airline)}` : ""}</span><b class="rtprice" title="${esc(x.bag)}">$${x.price}${x.bag ? '<span class="bagflag">*</span>' : ""}</b>`
    : `<span class="muted small">no fare on that date</span>`}</div>`;
  const total = out && (back || !backDates.length) ? out.price + (back?.price || 0) : null;
  return `<div class="card rt"><div class="rthead"><b>Cheapest ${backDates.length ? "round trip" : "flight"}</b>
      <span class="opts small"><label><input type="radio" name="rtmode" value="nonstop"${rtBest ? "" : " checked"}> Nonstop</label><label><input type="radio" name="rtmode" value="best"${rtBest ? " checked" : ""}> Best price</label></span>
      <b class="rttotal">${total != null ? `$${total}${backDates.length ? " per person" : ""}` : "—"}</b></div>
    ${row(out, "Going", pick("rtOut", outDates, rtOut))}${backDates.length ? row(back, "Coming back", pick("rtBack", backDates, rtBack)) : ""}
    <div class="muted small" style="margin-top:6px">${rtBest ? "Best price counts 1-stop and skiplagged fares." : "Nonstop fares only."} Pick dates to price a specific trip, or leave "Cheapest date".${[out, back].some(x => x?.bag) ? ` <span style="color:var(--up)">* bag fee not included in that fare (tap the route for details).</span>` : ""}</div></div>`;
}
function render() {
  const going = trip.legs.filter(l => l.going), back = trip.legs.filter(l => !l.going);
  const pick = open != null && trip.legs[open];
  $("app").innerHTML = `<h1>${esc(trip.name || "Trip")}</h1>
    <div class="muted small">${trip.person ? `For ${esc(trip.person)} · ` : ""}Cheapest nonstop fare per person · updated ${esc(ago(trip.updated))} · checked about every hour</div>
    ${airportKey()}
    ${roundTripHtml()}
    ${trip.legs.some(l => l.skip || l.onestop) ? `<div class="opts" style="margin-top:10px"><span class="small muted">Sort by</span>
      <label class="small"><input type="radio" name="sortby" value="nonstop"${sortBest ? "" : " checked"}> Nonstop</label>
      <label class="small"><input type="radio" name="sortby" value="best"${sortBest ? " checked" : ""}> Best price</label></div>` : ""}
    ${signupHtml()}
    ${!trip.legs.length ? `<div class="card empty"><p class="muted">No flights in this trip yet.</p></div>` : ""}
    ${pick && pick.going ? detail(open) : ""}${table(going, back.length ? "Going" : "Flights")}
    ${pick && !pick.going ? detail(open) : ""}${table(back, "Coming back")}
    ${trip.legs.some(l => bagNote(l)) ? `<p class="small" style="margin-top:14px;color:var(--up)">* The airline's bag fee isn't included in that price: Google doesn't have it for ${esc([...new Set(trip.legs.flatMap(l => Object.keys(l.bagless || {})))].join(", "))}. Check the airline's own site.</p>` : ""}
    <p class="small muted" style="margin-top:18px">Tap a fare for times, other airlines, price history and a Google Flights link. Blue "1 stop" = a cheaper fare with one connection. Green: the route's cheapest date. Red or green text: up or down in the last 24 hours; a purple dot means it moved and came back or moved more than once.${trip.skiplagged ? " \"skip\" fares are hidden-city tickets: cheaper, but with rules (tap one to see)." : ""} This page only shows fares; book on the airline's site or Google Flights.</p>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.sort) {
    const [dir, key] = b.dataset.sort.split("|");
    sortBy[dir] = sortBy[dir] === key ? null : key;
    const wraps = [...document.querySelectorAll(".tablewrap")].map(w => w.scrollLeft);  // stay where you were
    render();
    document.querySelectorAll(".tablewrap").forEach((w, i) => { w.scrollLeft = wraps[i] || 0; });
    return;
  }
  if (b.dataset.open) { open = +b.dataset.open === open ? null : +b.dataset.open; render(); document.querySelector(".detail")?.scrollIntoView({block: "nearest", behavior: "smooth"}); }
  else if (b.dataset.close) { open = null; render(); }
  else if (b.dataset.signupOpen) { signupOpen = true; render(); $("suEmail")?.focus(); }
  else if (b.dataset.signupClose) { signupOpen = false; render(); }
  else if (b.dataset.signup) {
    const email = $("suEmail").value.trim(), when = document.querySelector("input[name=suWhen]:checked").value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say("Enter your email address.");
    const id = [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2, "0")).join("");
    b.disabled = true;
    post({a: "sub", id, email, schedule: when, hour: +$("suHour").value, day: +$("suDay").value, tz: Intl.DateTimeFormat().resolvedOptions().timeZone})
      .then(() => { $("app").querySelector(".signup").innerHTML = `<b>You're signed up.</b><div class="small muted" style="margin-top:6px">The first email, with today's fares, arrives within about an hour at ${esc(email)}.</div>`; },
            () => { b.disabled = false; say("Couldn't sign you up. Check your connection and try again."); });
  }
  else if (b.dataset.stopEmails) {
    b.disabled = true;
    post({a: "stop", id: stopId})
      .then(() => { $("app").querySelector(".signup").innerHTML = `<b>Done.</b><div class="small muted" style="margin-top:6px">The emails stop within about an hour.</div>`; },
            () => { b.disabled = false; say("Couldn't reach the server. Try again."); });
  }
});
document.addEventListener("change", e => {
  if (e.target.name === "rtmode" || e.target.id === "rtOut" || e.target.id === "rtBack") {
    if (e.target.name === "rtmode") rtBest = e.target.value === "best";
    else if (e.target.id === "rtOut") rtOut = e.target.value;
    else rtBack = e.target.value;
    render();
    return;
  }
  if (e.target.name === "sortby") {
    sortBest = e.target.value === "best";
    const wraps = [...document.querySelectorAll(".tablewrap")].map(w => w.scrollLeft);
    render();
    document.querySelectorAll(".tablewrap").forEach((w, i) => { w.scrollLeft = wraps[i] || 0; });
    return;
  }
  if (e.target.name === "suWhen") {
    $("suTime").hidden = e.target.value === "changes";
    $("suDayWrap").hidden = e.target.value !== "weekly";
  }
});
window.addEventListener("hashchange", () => { open = null; load(); });
load();
</script>
</body>
