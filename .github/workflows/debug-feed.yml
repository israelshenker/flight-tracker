name: Debug feed prices
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import json, urllib.parse
          import google_flights as g
          from primp import Client

          def feed(bags_at, value, adults=1):
              segment = [[[["FLL", 0]]], [[["PHL", 0]]], None, 2, None, None, "2026-12-02", None, None, None, None, None, None, None, 3]
              main = ([None, None, 2, None, [], 1, [adults, 0, 0, 0], None, None, None, None, None, None, [segment]]
                      + [None] * 3 + [1] + [None] * 10 + [0])
              if bags_at is not None:
                  main[bags_at] = value
              body = [[], main, 2, 1, 0, 1]
              data = "f.req=" + urllib.parse.quote(json.dumps([None, json.dumps(body, separators=(",", ":"))], separators=(",", ":")))
              c = Client(impersonate="chrome_145", impersonate_os="macos", referer=True, cookie_store=True)
              res = c.post(g.FEED_URL + "?hl=en&curr=USD&gl=us", content=data.encode(),
                           headers={"content-type": "application/x-www-form-urlencoded;charset=UTF-8"})
              t = res.text.lstrip()[4:].lstrip()
              if t[:1].isdigit():
                  t = t.split("
", 1)[1]
              outer = json.JSONDecoder().raw_decode(t)[0]
              inner = json.loads(outer[0][2])
              out = []
              for sec in (2, 3):
                  blk = inner[sec] if len(inner) > sec else None
                  for item in (blk[0] if blk and blk[0] else []):
                      try:
                          if len(item[0][2]) == 2:
                              out.append(int(item[1][0][1]))
                      except Exception:
                          pass
              return sorted(out)[:2]

          tries = [("no bags", None, None), ("10=[checked,carry]", 10, [0, 1]), ("10=[carry,checked]", 10, [1, 0]),
                   ("10=[[carry,checked]]", 10, [[1, 0]]), ("9=[checked,carry]", 9, [0, 1]), ("11=[checked,carry]", 11, [0, 1]),
                   ("10=[1,1]", 10, [1, 1]), ("10=[0,1,0]", 10, [0, 1, 0]), ("10=[1]", 10, [1])]
          for label, at, val in tries:
              try:
                  print(f"{label}: {feed(at, val)}")
              except Exception as e:
                  print(f"{label}: ERROR {type(e).__name__}")
          PY
